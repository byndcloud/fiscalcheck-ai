kind = "web"
previewPath = "/"
title = "FiscalCheck AI"
version = "1.0.0"
id = "artifacts/fiscalcheck"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23345

[services.development]
run = "pnpm --filter @workspace/fiscalcheck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fiscalcheck", "run", "build" ]
publicDir = "artifacts/fiscalcheck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23345"
BASE_PATH = "/"
