version: 2

# Política deste arquivo:
# 1. Dependabot NÃO abre PRs de major bump (ignore global). Majors
#    são tratados manualmente em branch dedicada, com migração
#    explícita e revisão humana — alinhado ao AGENTS.md (sem
#    aprovação silenciosa de mudanças de runtime na stack fiscal).
# 2. Para pacotes em série 0.x (onde semver não classifica 0.Y -> 0.Z
#    como major), usamos `ignore.versions` por pacote, capando no teto
#    atual do constraint em pyproject.toml / package.json. Cada entrada
#    espelha um item do backlog em #26. Para destravar a migração
#    desses pacotes, REMOVER a entrada correspondente aqui na mesma
#    branch da migração manual.
# 3. Famílias com versões acopladas (react, next, tanstack, radix,
#    tailwind, fastapi, sqlalchemy, langchain, etc.) sobem em PR
#    único por família.
# 4. Tudo o que sobra é agrupado por dependency-type (production
#    vs development) — 1 PR mensal por grupo cobre o "long tail".
# 5. Schedule mensal (não semanal) para reduzir poluição do queue.
#    CVEs continuam vindo via `security-updates`, que ignoram o
#    schedule.
# 6. open-pull-requests-limit: 3 por ecossistema — teto duro.

updates:
  # JS/TS — monorepo pnpm (raiz pega tudo via workspaces)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    versioning-strategy: increase
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      # Bloqueio global de majors semver (>= X+1.0.0 vs constraint atual).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

      # Backlog manual em #26 — bumps 0.x ou que cruzam a barreira
      # de major do projeto, capados no teto atual de package.json.
      # Remover a entrada quando a migração manual for feita.
      - dependency-name: "tailwind-merge"
        versions: [">=3"]
      - dependency-name: "zod"
        versions: [">=4"]
      - dependency-name: "lucide-react"
        versions: [">=1"]
      - dependency-name: "@hookform/resolvers"
        versions: [">=4"]
      - dependency-name: "next"
        versions: [">=16"]
      - dependency-name: "@next/*"
        versions: [">=16"]
      - dependency-name: "eslint-config-next"
        versions: [">=16"]
      - dependency-name: "vitest"
        versions: [">=3"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=5"]
      - dependency-name: "jsdom"
        versions: [">=26"]
      - dependency-name: "@biomejs/biome"
        versions: [">=2"]
      - dependency-name: "@commitlint/cli"
        versions: [">=20"]
      - dependency-name: "@commitlint/config-conventional"
        versions: [">=20"]
      - dependency-name: "lint-staged"
        versions: [">=16"]
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      nextjs:
        patterns: ["next", "@next/*", "eslint-config-next"]
      tanstack:
        patterns: ["@tanstack/*"]
      radix:
        patterns: ["@radix-ui/*", "radix-ui"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tw-animate-css"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Python — apps/api com uv (pyproject.toml + uv.lock)
  #
  # TODO(verificar no primeiro PR pip): o CI da API roda `uv sync --frozen`
  # (.github/workflows/ci.yml), o que exige uv.lock consistente com
  # pyproject.toml. Confirmar que o dependabot regrava apps/api/uv.lock
  # junto com pyproject.toml. Se NAO regravar, adicionar workflow
  # auxiliar que roda `uv lock` em branches dependabot/pip/** e commita
  # de volta. Fallback: migrar ecossistema pip para Renovate (suporte
  # uv.lock nativo). Tracking: #26 (seção Follow-ups operacionais).
  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      # Bloqueio global de majors semver (>= X+1.0.0 vs constraint atual).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

      # Backlog manual em #26 — capa de versão por pacote, espelhando
      # o teto atual de apps/api/pyproject.toml. Para destravar a
      # migração de qualquer um destes, remover a entrada aqui na
      # mesma branch da migração e regravar apps/api/uv.lock.
      - dependency-name: "fastapi"
        versions: [">=0.116"]
      - dependency-name: "uvicorn"
        versions: [">=0.33"]
      - dependency-name: "asyncpg"
        versions: [">=0.31"]
      - dependency-name: "pgvector"
        versions: [">=0.4"]
      - dependency-name: "redis"
        versions: [">=6"]
      - dependency-name: "pyarrow"
        versions: [">=19"]
      - dependency-name: "structlog"
        versions: [">=25"]
      - dependency-name: "python-json-logger"
        versions: [">=3"]
      - dependency-name: "python-multipart"
        versions: [">=0.0.20"]
      - dependency-name: "langgraph"
        versions: [">=0.3"]
      - dependency-name: "langchain-core"
        versions: [">=0.4"]
      - dependency-name: "pytest"
        versions: [">=9"]
      - dependency-name: "pytest-asyncio"
        versions: [">=0.25"]
      - dependency-name: "pytest-cov"
        versions: [">=7"]
      - dependency-name: "ruff"
        versions: [">=0.9"]
      - dependency-name: "ipython"
        versions: [">=9"]
    groups:
      fastapi:
        patterns: ["fastapi", "uvicorn", "pydantic", "pydantic-settings"]
      sqlalchemy:
        patterns: ["sqlalchemy", "alembic", "asyncpg", "psycopg", "pgvector"]
      ml:
        patterns: ["scikit-learn", "numpy", "networkx", "polars", "pyarrow"]
      langchain:
        patterns: ["langgraph", "langchain*"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # GitHub Actions — volume baixo, sem agrupamento. Majors aqui
  # também são manuais (#26).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "ci(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
