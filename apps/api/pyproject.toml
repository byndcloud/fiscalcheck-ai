[project]
name = "fiscocheck-api"
version = "0.1.0"
description = "FiscoCheck AI — Backend FastAPI (agentes IA, ETL, ML, graph analytics)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Beyond / Aurora" },
]

dependencies = [
  # Web framework
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0,<0.33",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",

  # Banco
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "alembic>=1.14.0,<2",
  "asyncpg>=0.30.0,<0.31",
  "psycopg[binary,pool]>=3.2.0,<4",
  "pgvector>=0.3.0,<0.4",

  # Cache / fila
  "redis>=5.2.0,<6",

  # Auth e segurança
  "passlib[bcrypt]>=1.7.4,<2",
  "python-jose[cryptography]>=3.3.0,<4",
  "pyotp>=2.9.0,<3",

  # Observabilidade / logging estruturado
  "structlog>=24.4.0,<25",
  "python-json-logger>=2.0.7,<3",

  # ETL
  "polars>=1.17.0,<2",
  "pyarrow>=18.1.0,<25",
  "httpx>=0.28.0,<0.29",

  # ML / IA
  "scikit-learn>=1.5.0,<2",
  "numpy>=2.1.0,<3",
  "networkx>=3.4.0,<4",

  # Agentes (LangGraph)
  "langgraph>=0.2.55,<0.3",
  "langchain-core>=0.3.20,<0.4",

  # Utilitários
  "python-multipart>=0.0.19,<0.0.20",
  "email-validator>=2.2.0,<3",
  "tenacity>=9.0.0,<10",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<0.25",
  "pytest-cov>=6.0.0,<7",
  "httpx>=0.28.0,<0.29",
  "ruff>=0.8.0,<0.9",
  "pyright>=1.1.390,<2",
  "ipython>=8.30.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscocheck_api"]

[tool.uv]
package = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "alembic/versions"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "slow: marca testes que demoram (excluir com -m 'not slow')",
  "integration: testes que tocam serviços externos",
]
