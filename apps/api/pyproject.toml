[project]
name = "fiscalcheck-api"
version = "0.1.0"
description = "FiscalCheck AI — Backend FastAPI (agentes IA, ETL, ML, graph analytics)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Beyond / Aurora" },
]

# Dependências enxutas para o MVP (ver CHANGELOG). Libs de módulos ainda
# não implementados (polars, langgraph, scikit-learn, redis, pgvector etc.)
# serão adicionadas junto com o código que as usa.
dependencies = [
  # Web framework
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0,<0.33",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",

  # Banco (asyncpg no runtime; psycopg sync apenas para migrations Alembic)
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "alembic>=1.14.0,<2",
  "asyncpg>=0.30.0,<0.31",
  "psycopg[binary]>=3.2.0,<4",

  # Auth e segurança
  "bcrypt>=4.2.0,<5",
  "pyjwt>=2.10.0,<3",

  # Observabilidade / logging estruturado
  "structlog>=24.4.0,<25",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<0.25",
  "pytest-cov>=6.0.0,<7",
  "httpx>=0.28.0,<0.29",
  "ruff>=0.8.0,<0.9",
  "pyright>=1.1.390,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscalcheck_api"]

[tool.uv]
package = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "alembic/versions"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "slow: marca testes que demoram (excluir com -m 'not slow')",
  "integration: testes que tocam serviços externos",
]
