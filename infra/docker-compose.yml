name: fiscalcheck-ai

# Convenção (ver ADR-0002):
#   sem perfil → postgres com pgvector. Cobre o MVP e bate com o Replit Postgres.
#   graph      → postgres-age (pgvector + Apache AGE) no lugar do postgres
#                default, para validar a futura implementação AgeGraphStore.
# Ative com:
#   docker compose up -d                    # MVP (postgres + pgvector)
#   docker compose --profile graph up -d    # com AGE (não subir junto do default)

services:
  postgres:
    # pgvector/pgvector inclui a extensão vector pré-compilada — a imagem
    # postgres:16 pura NÃO tem pgvector e o init falharia.
    image: pgvector/pgvector:pg16
    container_name: fiscalcheck-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiscalcheck
      POSTGRES_INITDB_ARGS: "--locale=pt_BR.UTF-8"
      LANG: pt_BR.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiscalcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-age:
    # Imagem apache/age inclui pgvector e Apache AGE. Use só quando precisar
    # exercitar AgeGraphStore localmente — não é a topologia do MVP.
    image: apache/age:PG16_latest
    container_name: fiscalcheck-postgres-age
    profiles:
      - graph
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiscalcheck
      POSTGRES_INITDB_ARGS: "--locale=pt_BR.UTF-8"
      LANG: pt_BR.UTF-8
    ports:
      - "5433:5432"
    volumes:
      - postgres_age_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./postgres-init-age.sql:/docker-entrypoint-initdb.d/01-init-age.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiscalcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_age_data:
